<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Trustpilot – nyeste 3-5 stjerner</title>
<style>
  :root { --tp: #00b67a; --txt: #ffffff; --dim: rgba(255,255,255,.62); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--txt); }
  body { display: flex; flex-direction: column; padding: 4px 8px 6px; font-size: clamp(13px, 7vw, 34px); }
  .top { display: flex; align-items: center; gap: .45em; font-size: .78em; color: var(--dim); white-space: nowrap; }
  .top b { color: var(--txt); font-size: 1.25em; }
  .stars { display: inline-flex; gap: 2px; }
  .stars i { width: 1.05em; height: 1.05em; display: inline-grid; place-items: center; background: #dcdce6; }
  .stars i::before { content: "★"; color: #fff; font-style: normal; font-size: .8em; line-height: 1; }
  .s5 i.on { background: #00b67a; } .s4 i.on { background: #73cf11; } .s3 i.on { background: #ffce00; }
  .review { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0;
    transition: opacity .6s ease; }
  .review.fade { opacity: 0; }
  .meta { display: flex; align-items: center; gap: .5em; font-size: .72em; color: var(--dim); margin-bottom: .3em; }
  .new { background: var(--tp); color: #fff; font-weight: 700; padding: .05em .45em; border-radius: 3px; }
  .title { font-weight: 700; font-size: 1em; line-height: 1.2; margin-bottom: .2em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .text { font-size: .82em; line-height: 1.3; color: var(--dim);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .foot { display: flex; justify-content: space-between; align-items: center; font-size: .68em; color: var(--dim); }
  .dots { display: flex; gap: 3px; } .dots span { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.3); }
  .dots span.on { background: var(--tp); }
  .msg { flex: 1; display: grid; place-items: center; color: var(--dim); font-size: .8em; text-align: center; }
</style>
</head>
<body>
  <div class="top" id="top"></div>
  <div class="review" id="review"><div class="msg">Henter anmeldelser …</div></div>
  <div class="foot"><span id="who"></span><span class="dots" id="dots"></span></div>

<script>
  // MOBILCOVERS.DK på Trustpilot – kun 3-, 4- og 5-stjernede danske anmeldelser
  var DATA_URL = "https://widget.trustpilot.com/trustbox-data/53aa8912dec7e10d38f59f36"
    + "?businessUnitId=4ed88f6e000064000511b59d&locale=da-DK&reviewLanguages=da"
    + "&reviewStars=3,4,5&includeReviews=true&reviewsPerPage=10";
  var ROTATE_MS = 10000;          // skift anmeldelse hvert 10. sekund
  var REFRESH_MS = 5 * 60 * 1000; // hent nye anmeldelser hvert 5. minut
  var SHOW = 6;                   // antal anmeldelser i rotationen

  var reviews = [], idx = 0, rotateTimer = null;

  function starsHtml(n) {
    var h = '<span class="stars s' + n + '">';
    for (var i = 1; i <= 5; i++) h += '<i class="' + (i <= n ? 'on' : '') + '"></i>';
    return h + '</span>';
  }
  function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function ago(iso) {
    var m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (m < 60) return 'for ' + Math.max(m, 1) + ' min. siden';
    var h = Math.round(m / 60); if (h < 24) return 'for ' + h + ' t. siden';
    var d = Math.round(h / 24); return 'for ' + d + (d === 1 ? ' dag' : ' dage') + ' siden';
  }

  function show(i) {
    var r = reviews[i]; if (!r) return;
    var el = document.getElementById('review');
    el.classList.add('fade');
    setTimeout(function () {
      var isNew = (Date.now() - new Date(r.createdAt).getTime()) < 24 * 3600 * 1000;
      el.innerHTML =
        '<div class="meta">' + starsHtml(r.stars) + (isNew ? '<span class="new">Ny</span>' : '') +
        '<span>' + ago(r.createdAt) + '</span></div>' +
        '<div class="title">' + esc(r.title) + '</div>' +
        '<div class="text">' + esc(r.text) + '</div>';
      document.getElementById('who').textContent = (r.consumer && r.consumer.displayName || '').trim();
      document.getElementById('dots').innerHTML = reviews.map(function (_, k) {
        return '<span class="' + (k === i ? 'on' : '') + '"></span>'; }).join('');
      el.classList.remove('fade');
    }, 400);
  }

  function load() {
    fetch(DATA_URL).then(function (res) { return res.json(); }).then(function (j) {
      var bu = j.businessUnit || {};
      var score = String(bu.trustScore || '').replace('.', ',');
      document.getElementById('top').innerHTML = '<b>' + score + '</b>' +
        starsHtml(Math.round(bu.stars || 5));
      reviews = (j.reviews || []).filter(function (r) { return r.stars >= 3; }).slice(0, SHOW);
      if (!reviews.length) { document.getElementById('review').innerHTML = '<div class="msg">Ingen nye anmeldelser lige nu</div>'; return; }
      idx = 0; show(idx);
      clearInterval(rotateTimer);
      rotateTimer = setInterval(function () { idx = (idx + 1) % reviews.length; show(idx); }, ROTATE_MS);
    }).catch(function () {
      if (!reviews.length) document.getElementById('review').innerHTML =
        '<div class="msg">Kunne ikke hente anmeldelser fra Trustpilot. Prøver igen om 5 min.</div>';
    });
  }

  load();
  setInterval(load, REFRESH_MS);
</script>
</body>
</html>
